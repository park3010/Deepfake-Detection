[project]
name = "idcnet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "efficientnet-pytorch>=0.7.1",
    "torchmetrics>=1.8.1",
    "lightning>=2.5.2",
    "opencv-python>=4.12.0.88",
    "lmdb>=1.7.3",
    "pyarrow>=21.0.0",
    "albumentations>=2.0.8",
]


# --- UV 特定的配置 ---
[[tool.uv.index]]
name = "qinghua_source"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch" },
]
torchaudio = [
  { index = "pytorch" },
]
torchvision = [
    { index = "pytorch" },
]
